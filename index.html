/* Vitrola: light editorial palette, warm paper and pastel accents */
:root{--rose:#f2c2db;--rose-ink:#82556c;--yellow:#f7dc83;--blue:#bdd9f4;--green:#cbdcaf;--peach:#f7c8ab;--charcoal:#282725;--icon-bg:#e7ebe1;--accent-ink:#82556c}
html{color-scheme:light}
body{background:var(--bg)}
a{color:#77516c}
.mark{background:var(--icon-bg);box-shadow:none;color:var(--rose-ink);flex-shrink:0}
.mark svg{width:41px;height:41px}
.nav{padding:5px;border-radius:17px}
.nav button{color:#eae4da}
.nav button.active{background:var(--rose);color:var(--charcoal)}
.nav button:not(.active):hover{background:#45423e;color:#fffaf1}
.btn.primary{background:var(--rose);color:var(--charcoal);border-color:var(--rose)}
.btn.primary:hover{background:#f7d5e7}
.btn.danger{color:#a33e42}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline-color:var(--rose-ink)}
.hero-main{background:var(--yellow);border-color:transparent}
.hero-main .eyebrow{color:#615022}
.hero-main .btn.primary{background:var(--charcoal);color:#fffaf1;border-color:var(--charcoal)}
.hero-main .btn.primary:hover{background:#45423e}
.hero-art{color:#574920;opacity:.16;pointer-events:none}
.stats .stat{border:0;min-height:100px}
.stats .stat:nth-child(1){background:var(--rose)}
.stats .stat:nth-child(2){background:var(--blue)}
.stats .stat:nth-child(3){background:var(--green)}
.stats .stat:nth-child(4){background:var(--peach)}
.stat span{color:#49443c}
.eyebrow,.rating,.bigscore,.track input,.track .note-btn.hasnote,.playlist a{color:var(--accent-ink)}
.album,.playlist,.detail,.artistcard,.authbox,.modal{background:var(--panel);border-color:var(--line)}
.album:hover,.artistcard:hover{border-color:var(--rose-ink)}
.cover.placeholder{background:linear-gradient(145deg,#f1dbeb,#dce6f0);color:var(--rose-ink)}
.chip:hover{border-color:var(--rose-ink)}
.chip.active{background:var(--rose);border-color:var(--rose);color:var(--charcoal)}
.status{border-radius:99px}
.track input{color:var(--accent-ink)}
.toast{background:var(--charcoal);color:#fffaf1}
@media(max-width:680px){.stats .stat{min-height:80px}.mark svg{width:36px;height:36px}}

/* Navigation stays inside the bar: all five tabs visible on phones. */
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible;gap:6px}
.nav button{min-width:0;max-width:100%;white-space:normal;overflow-wrap:normal;text-align:center;line-height:1.25;min-height:44px}
.nav button:focus-visible{outline-offset:-2px}
@media(max-width:680px){
  .nav{gap:3px;padding:4px;border-radius:15px}
  .nav button{padding:8px 2px;font-size:11px;line-height:1.2;min-height:46px;border-radius:10px}
}
@media(max-width:340px){
  .nav button{font-size:10px;padding-inline:1px}
}

function showAlbumForm(a){
let editing=!!a,checked=listForAlbum(a?.id||'').map(l=>l.id);
modal('<h2>'+(editing?'Editar álbum':'Adicionar álbum')+'</h2><form id="albumForm">'+field('Nome do álbum *','aTitle','Ex.: Renaissance','text',a?.title||'')+field('Artista *','aArtist','Nome do artista','text',a?.artist||'')+'<div class="two">'+field('Ano','aYear','2026','number',a?.release_year||'')+field('Gênero','aGenre','Pop, rock, MPB...', 'text',a?.genre||'')+'</div>'+field('Link do álbum no Spotify','aSpotify','https://open.spotify.com/album/...','url',a?.spotify_url||'')+'<div class="field"><label><input type="checkbox" id="aSpotifyUnavailable" '+(a?.spotify_unavailable&&!a?.spotify_url?'checked':'')+'> Indisponível no Spotify (confirmado)</label></div>'+field('Link do álbum no YouTube (alternativo)','aYoutube','https://www.youtube.com/watch?v=...','url',a?.youtube_url||'')+field('Link alternativo (Ouvir Música)','aListening','https://www.ouvirmusica.com.br/...','url',a?.listening_url||'')+field('URL da capa','aCover','Link direto da imagem','url',a?.cover_url||'')+'<div class="field"><label>Adicionar às listas</label><div class="checks">'+lists.map(l=>'<label><input type="checkbox" name="aLists" value="'+l.id+'" '+(checked.includes(l.id)||(!editing&&l.slug==='quero-ouvir')?'checked':'')+'> '+esc(l.name)+'</label>').join('')+'</div></div><div class="field"><label for="aStatus">Status</label><select id="aStatus"><option value="quero_ouvir" '+((a?.status||'quero_ouvir')==='quero_ouvir'?'selected':'')+'>Quero ouvir</option><option value="ouvindo" '+(a?.status==='ouvindo'?'selected':'')+'>Ouvindo</option><option value="concluido" '+(a?.status==='concluido'?'selected':'')+'>Concluído</option></select></div><div class="modalactions"><button type="button" class="btn ghost" id="cancelModal">Cancelar</button><button class="btn primary" type="submit">Salvar álbum</button></div></form>');
$('cancelModal').onclick=closeModal;
$('albumForm').onsubmit=async e=>{e.preventDefault();const rawYoutube=$('aYoutube').value.trim(),youtube=youtubeLink(rawYoutube);if(rawYoutube&&!youtube){toast('Informe um link HTTPS válido do YouTube.');return}const rawListening=$('aListening').value.trim(),listening=alternativeLink(rawListening);if(rawListening&&!listening){toast('Informe um link HTTPS válido do Ouvir Música.');return}let payload={user_id:user.id,title:$('aTitle').value.trim(),artist:$('aArtist').value.trim(),release_year:$('aYear').value?Number($('aYear').value):null,genre:$('aGenre').value.trim()||null,spotify_url:$('aSpotify').value.trim()||null,spotify_unavailable:!$('aSpotify').value.trim()&&$('aSpotifyUnavailable').checked,youtube_url:youtube,listening_url:listening,cover_url:$('aCover').value.trim()||null,status:$('aStatus').value,updated_at:new Date().toISOString()};if(!payload.title||!payload.artist)return;
let res=editing?await sb.from('discos_albums').update(payload).eq('id',a.id).select().single():await sb.from('discos_albums').insert(payload).select().single();if(res.error){toast('Erro: '+res.error.message);return}let saved=res.data;if(editing)albums=albums.map(x=>x.id===a.id?saved:x);else albums.unshift(saved);
let ids=Array.from(document.querySelectorAll('input[name="aLists"]:checked')).map(x=>x.value);await sb.from('discos_album_lists').delete().eq('album_id',saved.id);if(ids.length){let rows=ids.map(id=>({user_id:user.id,album_id:saved.id,list_id:id}));let ins=await sb.from('discos_album_lists').insert(rows);if(ins.error){toast('Álbum salvo; erro nas listas: '+ins.error.message)}}
await loadData(false);selectedAlbum=editing?a.id:saved.id;closeModal();render();toast('Álbum salvo ✓')};
}
function showTrackForm(){
let a=albums.find(x=>x.id===selectedAlbum);modal('<h2>Adicionar faixas</h2><form id="tracksForm"><div class="field"><label for="trackLines">Uma música por linha</label><textarea id="trackLines" placeholder="1. Intro&#10;2. Primeira música&#10;3. Outra música" style="min-height:190px"></textarea></div><p class="hint">A numeração é opcional. As faixas entram na ordem digitada.</p><div class="modalactions"><button type="button" class="btn ghost" id="cancelModal">Cancelar</button><button class="btn primary">Adicionar faixas</button></div></form>');$('cancelModal').onclick=closeModal;$('tracksForm').onsubmit=async e=>{e.preventDefault();let names=$('trackLines').value.split('\n').map(x=>x.replace(/^\s*\d+[.)-]\s*/, '').trim()).filter(Boolean);if(!names.length)return;let start=albumTracks(a.id).length;let rows=names.map((title,i)=>({user_id:user.id,album_id:a.id,title,position:start+i+1}));let r=await sb.from('discos_tracks').insert(rows);if(r.error){toast('Erro: '+r.error.message);return}await loadData(false);closeModal();render();toast(names.length+' faixa(s) adicionada(s) ✓')};
}
function showPlaylistForm(){
modal('<h2>Adicionar playlist</h2><form id="playlistForm">'+field('Nome da playlist *','pName','Ex.: Novembro 2026')+'<div class="field"><label for="pKind">Tipo</label><select id="pKind"><option value="mensal">Mensal</option><option value="tematica">Temática</option></select></div>'+field('Mês / referência','pMonth','Ex.: Novembro de 2026')+field('Link do Spotify *','pSpotify','https://open.spotify.com/playlist/...','url')+field('URL da capa (opcional)','pCover','Link direto da imagem','url')+'<div class="modalactions"><button type="button" class="btn ghost" id="cancelModal">Cancelar</button><button class="btn primary">Salvar playlist</button></div></form>');$('cancelModal').onclick=closeModal;$('playlistForm').onsubmit=async e=>{e.preventDefault();let payload={user_id:user.id,name:$('pName').value.trim(),kind:$('pKind').value,month_label:$('pMonth').value.trim()||null,spotify_url:$('pSpotify').value.trim(),cover_url:$('pCover').value.trim()||null};if(!payload.name||!payload.spotify_url)return;let r=await sb.from('discos_playlists').insert(payload).select().single();if(r.error){toast('Erro: '+r.error.message);return}playlists.unshift(r.data);closeModal();render();toast('Playlist salva ✓')};
}
async function loadData(doRender=true){
let names=['discos_albums','discos_tracks','discos_playlists','discos_lists','discos_album_lists'];
const allRows=async n=>{let out=[],offset=0;while(true){let q=sb.from(n).select('*');q=n==='discos_album_lists'?q.order('album_id').order('list_id'):q.order('id');let r=await q.range(offset,offset+499);if(r.error)throw r.error;out.push(...(r.data||[]));if((r.data||[]).length<500)break;offset+=500}return out};
[albums,tracks,playlists,lists,albumLists]=await Promise.all(names.map(allRows));lists.sort((a,b)=>a.sort_order-b.sort_order);
if(doRender)render();
}
async function ensureLists(){
let r=await sb.from('discos_lists').select('slug');if(r.error)throw r.error;let have=new Set((r.data||[]).map(x=>x.slug));let missing=LISTS.filter(x=>!have.has(x.slug)).map(x=>({...x,user_id:user.id}));if(missing.length){let ins=await sb.from('discos_lists').insert(missing);if(ins.error)throw ins.error}
}
async function openAlbum(id){selectedAlbum=id;if(page!=='listas')page='acervo';render();$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
async function saveRating(id,value){let n=value===''?null:Number(value);if(n!==null&&(!Number.isFinite(n)||n<0||n>10)){toast('Use uma nota entre 0 e 10.');return}let r=await sb.from('discos_tracks').update({rating:n,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){toast('Erro ao salvar nota: '+r.error.message);return}tracks=tracks.map(t=>t.id===id?{...t,rating:n}:t);render();toast('Nota salva ✓')}
function showTrackNote(id){let t=tracks.find(x=>x.id===id);modal('<h2>Anotação da música</h2><p style="color:var(--muted);font-size:12px;margin-top:-8px">'+esc(t.title)+'</p><form id="trackNoteForm"><div class="field"><label for="trackNote">Sua impressão</label><textarea id="trackNote" placeholder="O que chamou sua atenção?">'+esc(t.notes||'')+'</textarea></div><div class="modalactions"><button type="button" class="btn ghost" id="cancelModal">Cancelar</button><button class="btn primary">Salvar</button></div></form>');$('cancelModal').onclick=closeModal;$('trackNoteForm').onsubmit=async e=>{e.preventDefault();let note=$('trackNote').value.trim();let r=await sb.from('discos_tracks').update({notes:note,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){toast('Erro: '+r.error.message);return}tracks=tracks.map(x=>x.id===id?{...x,notes:note}:x);closeModal();render();toast('Anotação salva ✓')}}
async function setAlbumLists(){
let checks=Array.from(document.querySelectorAll('[data-albumlist]'));for(let c of checks){let has=albumLists.some(x=>x.album_id===selectedAlbum&&x.list_id===c.dataset.albumlist);if(c.checked&&!has){let r=await sb.from('discos_album_lists').insert({user_id:user.id,album_id:selectedAlbum,list_id:c.dataset.albumlist});if(r.error)toast(r.error.message)}else if(!c.checked&&has){let r=await sb.from('discos_album_lists').delete().eq('album_id',selectedAlbum).eq('list_id',c.dataset.albumlist);if(r.error)toast(r.error.message)}}await loadData(false);render();toast('Listas atualizadas ✓')}
async function toggleComplete(){let a=albums.find(x=>x.id===selectedAlbum),done=a.status!=='concluido';let r=await sb.from('discos_albums').update({status:done?'concluido':'ouvindo',completed_at:done?new Date().toISOString().slice(0,10):null,updated_at:new Date().toISOString()}).eq('id',a.id).select().single();if(r.error){toast(r.error.message);return}albums=albums.map(x=>x.id===a.id?r.data:x);render();toast(done?'Álbum concluído ✓':'Álbum voltou para ouvindo')}
async function surprise(){let pool=albums.filter(a=>a.status==='quero_ouvir'&&!isFuture(a));if(!pool.length){toast('Sua fila está vazia. Adicione álbuns em Quero ouvir.');return}let a=pool[Math.floor(Math.random()*pool.length)];selectedAlbum=a.id;render();toast('A próxima audição: '+a.title)}
async function deleteAlbum(){let a=albums.find(x=>x.id===selectedAlbum);if(!confirm('Excluir "'+a.title+'" e suas avaliações?'))return;let r=await sb.from('discos_albums').delete().eq('id',a.id);if(r.error){toast(r.error.message);return}selectedAlbum=null;await loadData(false);render();toast('Álbum excluído')}
function bind(){
$('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(!b)return;selectedAlbum=null;page=b.dataset.page;query='';activeList=null;activeArtist=null;render()};
$('main').onclick=async e=>{
if(e.target.closest('[data-itunes-link]'))return;
let a=e.target.closest('[data-album]');if(a){openAlbum(a.dataset.album);return}
let b=e.target.closest('[data-open]');if(b){openAlbum(b.dataset.open);return}
if(e.target.closest('#addAlbum')||e.target.closest('#addAlbumHome')){showAlbumForm(null);return}
if(e.target.closest('#surpriseBtn')){surprise();return}
if(e.target.closest('#continueBtn')){let id=e.target.closest('#continueBtn').dataset.id;let x=albums.find(a=>a.id===id);if(x.status==='quero_ouvir'){let r=await sb.from('discos_albums').update({status:'ouvindo',started_at:new Date().toISOString().slice(0,10)}).eq('id',id).select().single();if(r.error){toast(r.error.message);return}albums=albums.map(a=>a.id===id?r.data:a)}openAlbum(id);return}
if(e.target.closest('#addPlaylist')){showPlaylistForm();return}
if(e.target.closest('#backAlbums')){selectedAlbum=null;render();return}
if(e.target.closest('#mbCatalog')){mb.panel();return}
if(e.target.closest('#mbAlbum')){mb.panel(albums.find(x=>x.id===selectedAlbum));return}
if(e.target.closest('#spAlbum')){sp.panel(albums.find(x=>x.id===selectedAlbum));return}
if(e.target.closest('#editAlbum')){showAlbumForm(albums.find(x=>x.id===selectedAlbum));return}
if(e.target.closest('#deleteAlbum')){deleteAlbum();return}
if(e.target.closest('#addTracks')){showTrackForm();return}
if(e.target.closest('#toggleComplete')){toggleComplete();return}
if(e.target.closest('#saveAlbumNotes')){let r=await sb.from('discos_albums').update({notes:$('albumNotes').value,updated_at:new Date().toISOString()}).eq('id',selectedAlbum);if(r.error){toast(r.error.message);return}albums=albums.map(a=>a.id===selectedAlbum?{...a,notes:$('albumNotes').value}:a);toast('Anotação salva ✓');return}
let nt=e.target.closest('[data-tracknote]');if(nt){showTrackNote(nt.dataset.tracknote);return}
let ar=e.target.closest('[data-artist]');if(ar){activeArtist=ar.dataset.artist;render();return}if(e.target.closest('#backArtists')){activeArtist=null;render();return}
let chip=e.target.closest('[data-list]');if(chip){activeList=chip.dataset.list||null;activeArtist=null;render();return}
};
$('main').onchange=async e=>{if(e.target.matches('[data-rating]'))await saveRating(e.target.dataset.rating,e.target.value);if(e.target.matches('[data-albumlist]'))await setAlbumLists();if(e.target.id==='statusFilter'){let val=e.target.value;let arr=albums.filter(a=>(!val||a.status===val)&&(!query||(a.title+' '+a.artist).toLowerCase().includes(query.toLowerCase())));$('albumGrid').innerHTML=arr.length?arr.map(albumCard).join(''):'<div class="empty">Nenhum álbum neste filtro.</div>'}};
$('main').oninput=e=>{if(e.target.id==='albumSearch'){query=e.target.value;let arr=albums.filter(a=>(a.title+' '+a.artist).toLowerCase().includes(query.toLowerCase()));$('albumGrid').innerHTML=arr.length?arr.map(albumCard).join(''):'<div class="empty">Nenhum resultado.</div>'}};
$('spStatus').onclick=()=>sp.panel();
$('logoutBtn').onclick=async()=>{sp.logout();mb.logout();await sb.auth.signOut();user=null;$('appView').hidden=true;$('authView').hidden=false};
$('modalback').onclick=e=>{if(e.target===$('modalback')&&!sp.isBusy()&&!mb.isBusy())closeModal()};

}
async function start(u){
  user=u;
  $('userEmail').textContent=u.email||'Conta conectada';
  $('loginError').textContent='Carregando sua biblioteca…';
  try{
    await ensureLists();
    await loadData(false);
    $('authView').hidden=true;
    $('appView').hidden=false;
    render();
    $('loginError').textContent='';
    bind();
    sp.status();
    await sp.callback();
  }catch(e){
    user=null;
    $('authView').hidden=false;
    $('appView').hidden=true;
    $('loginError').textContent='Sua conta entrou, mas não consegui carregar os dados: '+(e.message||e);
    console.error(e);
  }
}
async function init(){
  bind();
  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const button=$('loginBtn');
    const message=$('loginError');
    button.disabled=true;
    button.textContent='Entrando…';
    message.textContent='Verificando seus dados…';
    try{
      const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
      if(error)throw error;
      if(!data.user)throw new Error('O serviço não retornou uma conta autenticada.');
      await start(data.user);
    }catch(err){
      message.textContent=err.message||'Não foi possível entrar. Tente novamente.';
    }finally{
      button.disabled=false;
      button.textContent='Entrar';
    }
  });
  try{
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    if(data.session?.user)await start(data.session.user);
  }catch(err){
    $('loginError').textContent='Erro ao iniciar a autenticação: '+(err.message||err);
  }
}
init();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));}
})();
</script>
</body></html>
